<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>A2Z Software Solutions — Coming Soon</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Cpath d='M10 46 L10 30 Q10 18 22 18 L32 18 Q44 18 44 30 L44 46' fill='none' stroke='%23eae6da' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M44 46 L54 46 L54 30 Q54 18 42 18' fill='none' stroke='%23eae6da' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='46' r='2.6' fill='%23eae6da'/%3E%3Ccircle cx='54' cy='46' r='2.6' fill='%23eae6da'/%3E%3C/svg%3E"
  >

  <style>
    :root {
      box-sizing: border-box;

      --ink: #eae6da;
      --paper: #eae6da;
      --line: rgba(234, 230, 218, 0.2);
      --accent: #8fb996;

      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--paper);

      font-family:
        'Iowan Old Style',
        'Palatino Linotype',
        'Georgia',
        serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6vw;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(143, 185, 150, 0.35),
          transparent 45%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(63, 93, 67, 0.28),
          transparent 50%
        ),
        #12130f;

      background-attachment: fixed;
    }

    .frame {
      width: 100%;
      max-width: 640px;
      text-align: left;
    }

    /* Logo */
    .mark {
      width: 40px;
      height: 40px;
      margin-bottom: 3.5rem;
    }

    .mark path {
      stroke: var(--ink);
      stroke-width: 2.4;
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .mark circle {
      fill: var(--ink);
    }

    /* Brand */
    .brand {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      opacity: 0.6;

      margin: -2.6rem 0 2.4rem 0;
    }

    /* Main heading */
    h1 {
      font-family:
        'Iowan Old Style',
        'Palatino Linotype',
        'Georgia',
        serif;

      font-weight: 400;

      font-size: clamp(2.6rem, 8vw, 4.4rem);

      line-height: 1.03;
      letter-spacing: -0.01em;

      margin: 0 0 1.6rem 0;
    }

    /* Description */
    p.lede {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      font-size: 1.05rem;
      line-height: 1.6;

      max-width: 34ch;

      margin: 0 0 3rem 0;

      color: var(--ink);
      opacity: 0.72;
    }

    /* Divider */
    .rule {
      border: none;
      border-top: 1px solid var(--line);

      margin: 0 0 2rem 0;
    }

    /* Status */
    .status {
      display: flex;
      align-items: baseline;
      justify-content: space-between;

      gap: 1rem;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      font-size: 0.92rem;
    }

    .status .left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    /* Status dot */
    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--accent);

      flex: none;

      animation: pulse 2.4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    .status .right {
      color: var(--ink);
      opacity: 0.55;
    }

    /* Email form */
    form.notify {
      margin-top: 3rem;

      display: flex;
      gap: 0;

      border-bottom: 1px solid var(--line);

      padding-bottom: 0.6rem;

      max-width: 400px;
    }

    form.notify input[type="email"] {
      flex: 1;

      border: none;
      background: transparent;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      font-size: 0.95rem;

      color: var(--ink);

      padding: 0.3rem 0;

      outline: none;
    }

    form.notify input[type="email"]::placeholder {
      color: var(--ink);
      opacity: 0.4;
    }

    form.notify button {
      border: none;
      background: transparent;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      font-size: 0.95rem;

      color: var(--accent);

      cursor: pointer;

      padding: 0.3rem 0 0.3rem 1rem;
    }

    form.notify button:focus-visible,
    form.notify input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Confirmation message */
    .note {
      margin-top: 0.8rem;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      font-size: 0.82rem;

      color: var(--ink);

      opacity: 0;

      height: 0;

      overflow: hidden;

      transition: opacity 0.3s ease;
    }

    .note.show {
      opacity: 0.6;
      height: auto;
      margin-top: 0.8rem;
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding: 8vw;
      }

      .status {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
      }

      .status .right {
        font-size: 0.82rem;
      }

      form.notify {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="frame">

    <!-- Main Logo -->
    <svg
      class="mark"
      viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="A2Z Software Solutions logo"
    >
      <path d="M10 46 L10 30 Q10 18 22 18 L32 18 Q44 18 44 30 L44 46" />

      <path d="M44 46 L54 46 L54 30 Q54 18 42 18" />

      <circle cx="10" cy="46" r="2.6" />
      <circle cx="54" cy="46" r="2.6" />
    </svg>

    <!-- Company Name -->
    <div class="brand">
      A2Z Software Solutions
    </div>

    <!-- Main Heading -->
    <h1>
      This will open soon.
    </h1>

    <!-- Description -->
    <p class="lede">
      We're building something worth the wait.
      Leave your email and we'll let you know
      the moment the doors open.
    </p>

    <!-- Divider -->
    <hr class="rule">

    <!-- Status -->
    <div class="status">

      <span class="left">
        <span class="dot"></span>
        In progress
      </span>

      <span class="right">
        Est. launch — TBA
      </span>

    </div>

    <!-- Email Form -->
    <form class="notify" id="notifyForm">

      <input
        type="email"
        id="emailInput"
        placeholder="your@email.com"
        autocomplete="email"
        required
      >

      <button type="submit">
        Notify me
      </button>

    </form>

    <!-- Confirmation -->
    <div class="note" id="noteMsg">
      Thanks — we'll be in touch when we open.
    </div>

  </div>

  <script>
    document
      .getElementById('notifyForm')
      .addEventListener('submit', function (e) {

        e.preventDefault();

        var note = document.getElementById('noteMsg');

        note.classList.add('show');

        document.getElementById('emailInput').value = '';

      });
  </script>

</body>
</html>
